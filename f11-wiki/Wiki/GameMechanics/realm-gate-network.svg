<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="640" height="640" fill="#faf7f0"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">The Wheel of Realms — the Gate Network</text>
  <text x="320" y="45" text-anchor="middle" font-size="12" fill="#555">Every realm has five gates: two allied and three enemy - built by the Black at the Linking</text>

  <!-- ================= ENEMY EDGES (plain, distance 4/5, no barrier) ================= -->
  <g stroke="#c97a3d" stroke-width="1.4" stroke-dasharray="5,4" fill="none" opacity="0.85">
    <!-- 1-5 -->  <line x1="320" y1="90"  x2="455.2" y2="506.1"/>
    <!-- 1-6 -->  <line x1="320" y1="90"  x2="320"   y2="550"/>
    <!-- 2-6 -->  <line x1="455.2" y1="133.9" x2="320" y2="550"/>
    <!-- 4-10 --> <line x1="538.8" y1="391.1" x2="184.8" y2="133.9"/>
    <!-- 5-10 --> <line x1="455.2" y1="506.1" x2="184.8" y2="133.9"/>
    <!-- 6-10 --> <line x1="320"   y1="550"    x2="184.8" y2="133.9"/>
  </g>

  <!-- ================= ENEMY EDGES (gates, guarded by gargoyles) ================= -->
  <g stroke="#3a3a3a" stroke-width="1" fill="none">
    <!-- 1-7 --> <line x1="320" y1="90"  x2="184.8"   y2="506.1"/>
    <!-- 2-7 --> <line x1="455.2" y1="133.9" x2="184.8" y2="506.1"/>
    <!-- 2-8 --> <line x1="455.2" y1="133.9" x2="101.2" y2="391.1"/>
  </g>

  <!-- ================= ENEMY EDGES (gates, old-war, guarded by gargoyles) ================= -->
  <g stroke="#b5271a" stroke-width="3" fill="none">
    <!-- 3-7 --> <line x1="538.8" y1="248.9" x2="184.8" y2="506.1"/>
    <!-- 3-8 --> <line x1="538.8" y1="248.9" x2="101.2" y2="391.1"/>
    <!-- 3-9 --> <line x1="538.8" y1="248.9" x2="101.2" y2="248.9"/>
    <!-- 4-8 --> <line x1="538.8" y1="391.1" x2="101.2" y2="391.1"/>
    <!-- 4-9 --> <line x1="538.8" y1="391.1" x2="101.2" y2="248.9"/>
    <!-- 5-9 --> <line x1="455.2" y1="506.1" x2="101.2" y2="248.9"/>
  </g>

  <!-- ================= ALLIED EDGES (the ring, distance 1) ================= -->
  <g stroke="#3a3a3a" stroke-width="3" fill="none">
    <line x1="320"   y1="90"    x2="455.2" y2="133.9"/> <!-- 1-2 -->
    <line x1="455.2" y1="133.9" x2="538.8" y2="248.9"/> <!-- 2-3 -->
    <line x1="538.8" y1="248.9" x2="538.8" y2="391.1"/> <!-- 3-4 -->
    <line x1="538.8" y1="391.1" x2="455.2" y2="506.1"/> <!-- 4-5 -->
    <line x1="455.2" y1="506.1" x2="320"   y2="550"/>   <!-- 5-6 -->
    <line x1="320"   y1="550"   x2="184.8" y2="506.1"/> <!-- 6-7 -->
    <line x1="184.8" y1="506.1" x2="101.2" y2="391.1"/> <!-- 7-8 -->
    <line x1="101.2" y1="391.1" x2="101.2" y2="248.9"/> <!-- 8-9 -->
    <line x1="101.2" y1="248.9" x2="184.8" y2="133.9"/> <!-- 9-10 -->
    <line x1="184.8" y1="133.9" x2="320"   y2="90"/>    <!-- 10-1 -->
  </g>

  <!-- ================= NODES ================= -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <!-- 01 Institute -->
    <circle cx="320" cy="90" r="26" fill="#f2d94e" stroke="#222" stroke-width="1.5"/>
    <text x="320" y="95" fill="#222">01</text>
    <text x="320" y="58" text-anchor="middle" font-size="12" fill="#222">Institute of Eight</text>

    <!-- 02 Robots -->
    <circle cx="455.2" cy="133.9" r="26" fill="#b9bcc2" stroke="#222" stroke-width="1.5"/>
    <text x="455.2" y="138.9" fill="#222">02</text>
    <text x="500" y="108" text-anchor="middle" font-size="12" fill="#222">Robots</text>

    <!-- 03 Celestials -->
    <circle cx="538.8" cy="248.9" r="26" fill="#d84343" stroke="#222" stroke-width="1.5"/>
    <text x="538.8" y="253.9" fill="#fff">03</text>
    <text x="588" y="218.9" text-anchor="middle" font-size="12" fill="#222">Celestials</text>

    <!-- 04 Mystics -->
    <circle cx="538.8" cy="391.1" r="26" fill="#c23b8a" stroke="#222" stroke-width="1.5"/>
    <text x="538.8" y="396.1" fill="#fff">04</text>
    <text x="588" y="431.1" text-anchor="middle" font-size="12" fill="#222">Mystics</text>

    <!-- 05 Fey Folk -->
    <circle cx="455.2" cy="506.1" r="26" fill="#d9c7e8" stroke="#222" stroke-width="1.5"/>
    <text x="455.2" y="511.1" fill="#222">05</text>
    <text x="500" y="536" text-anchor="middle" font-size="12" fill="#222">Fey Folk</text>

    <!-- 06 Pirates -->
    <circle cx="320" cy="550" r="26" fill="#3f3a86" stroke="#222" stroke-width="1.5"/>
    <text x="320" y="555" fill="#fff">06</text>
    <text x="320" y="588" text-anchor="middle" font-size="12" fill="#222">Pirates</text>

    <!-- 07 Green Skins -->
    <circle cx="184.8" cy="506.1" r="26" fill="#2f6b3a" stroke="#222" stroke-width="1.5"/>
    <text x="184.8" y="511.1" fill="#fff">07</text>
    <text x="140" y="536" text-anchor="middle" font-size="12" fill="#222">Green Skins</text>

    <!-- 08 The Damned -->
    <circle cx="101.2" cy="391.1" r="26" fill="#4a4a4a" stroke="#222" stroke-width="1.5"/>
    <text x="101.2" y="396.1" fill="#fff">08</text>
    <text x="52" y="431.1" text-anchor="middle" font-size="12" fill="#222">The Damned</text>

    <!-- 09 Werebeasts -->
    <circle cx="101.2" cy="248.9" r="26" fill="#c9a06a" stroke="#222" stroke-width="1.5"/>
    <text x="101.2" y="253.9" fill="#222">09</text>
    <text x="52" y="218.9" text-anchor="middle" font-size="12" fill="#222">Werebeasts</text>

    <!-- 10 Aliens -->
    <circle cx="184.8" cy="133.9" r="26" fill="#a9d9a9" stroke="#222" stroke-width="1.5"/>
    <text x="184.8" y="138.9" fill="#222">10</text>
    <text x="140" y="108" text-anchor="middle" font-size="12" fill="#222">Aliens</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="12" fill="#222">
    <line x1="30" y1="600" x2="70" y2="600" stroke="#3a3a3a" stroke-width="3"/>
    <text x="78" y="604">Allied gate (neighbour, distance 1)</text>

    <line x1="30" y1="618" x2="70" y2="618" stroke="#c97a3d" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="78" y="622">Enemy gate (distance 4 or 5)</text>

    <line x1="340" y1="600" x2="380" y2="600" stroke="#3a3a3a" stroke-width="1"/>
    <text x="388" y="604">Enemy gate, guarded by gargoyles</text>

    <line x1="340" y1="618" x2="380" y2="618" stroke="#b5271a" stroke-width="3"/>
    <text x="388" y="622">Enemy old-war gate, guarded by gargoyles</text>
  </g>
</svg>
